syntax = "proto3";

package intel_hive;
option go_package = "github.com/akhil92kolli-hub/Intel-Hive/gen/proto";

message GenerateRequest {
  string request_id = 1;
  string model_id = 2;
  string prompt = 3;
  uint32 max_tokens = 4;
  float temperature = 5;
}

message GenerateResponse {
  string request_id = 1;
  string text = 2;
  uint32 generated_tokens = 3;
  double tokens_per_second = 4;
  string error = 5;
}
