syntax = "proto3";

package intel_hive;
option go_package = "github.com/akhil92kolli-hub/Intel-Hive/gen/proto";

message WorkerRegister {
  string protocol_version = 1;
  string worker_id = 2;
  string device_public_key = 3;
  string android_version = 4;
  string architecture = 5;
  uint64 ram_mb = 6;
  string gpu_vendor = 7;
  string gpu_name = 8;
  string inference_backend = 9;
  bool charging = 10;
  uint32 battery_percent = 11;
  string network_type = 12;
  double benchmark_score = 13;
}

message WorkerRegisterAck {
  bool accepted = 1;
  string worker_token = 2;
  uint32 heartbeat_interval_seconds = 3;
  string reason = 4;
}

message Heartbeat {
  string worker_id = 1;
  string state = 2;
  uint32 battery_percent = 3;
  bool charging = 4;
  float temperature_c = 5;
  float utilization = 6;
  double tokens_per_second = 7;
}

message ModelReady {
  string worker_id = 1;
  string model_id = 2;
  string shard_id = 3;
  uint32 layer_start = 4;
  uint32 layer_end = 5;
  uint64 model_size_bytes = 6;
  string sha256 = 7;
}
